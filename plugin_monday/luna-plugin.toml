name = "plugin-monday"
shown_name = "Monday.com"
version = "0.7.0"
description = "Monday.com boards, items, webhooks, full API access via GraphQL — and Luna listed as an agent inside monday."
entry = "plugin_monday"
sdk_version = "0"
license = "MIT"
tags = ["connector", "monday", "project-management", "oauth", "webhooks", "agent"]
readme = """
# plugin-monday

Manage Monday.com from Luna — boards, groups, items, subitems, columns,
updates (comments), webhook change triggers, and raw GraphQL for everything
else.

Connects with **one-click OAuth**: click Connect, approve in the Monday.com
popup, done. No monday app to create or install, no server configuration —
the plugin self-registers with monday (OAuth Dynamic Client Registration)
and refreshes tokens automatically. A **personal API token** paste remains
as a fallback.

Board webhooks (item created, column changed, status changed, ...) are
re-emitted on Luna's event bus as `monday.*` events for playbooks to react to.

**Luna inside monday.com**: one click in Settings lists Luna as an agent in
your monday account — chat with it from monday, @mention it in updates, or
assign it items. Replies stream back into monday.

Source: https://github.com/huemorgan/plugin-monday
"""

